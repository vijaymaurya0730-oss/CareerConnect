{% extends 'base.html' %}{% block content %}<h2>Candidate applications</h2>{% for a in applications %}<div class="card"><h3>{{a.title}} · {{a.company}}</h3><p><b>{{a.applicant}}</b> · {{a.email}}</p><p>{{a.cover_letter or 'No cover letter supplied.'}}</p><form method="post" action="{{url_for('update_status',application_id=a.id)}}"><select name="status">{% for s in ['Pending','Shortlisted','Rejected','Selected'] %}<option {% if a.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Update status</button></form></div>{% else %}<div class="card">No applications received yet.</div>{% endfor %}{% endblock %}
