{% extends 'base.html' %}{% block content %}<div class="card"><h2>Post a vacancy</h2><form method="post"><label>Job title</label><input name="title" required><label>Company</label><input name="company" required><label>Location</label><input name="location" required><label>Job type</label><select name="job_type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select><label>Salary range</label><input name="salary" placeholder="e.g. ₹3–5 LPA"><label>Description and requirements</label><textarea name="description" rows="6" required></textarea><button>Publish job</button></form></div>{% endblock %}
